name: Build Noviq AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Noviq AI project
        run: |
          unzip -o noviq-ai.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noviq-AI-debug-APK
          path: |
            **/build/outputs/apk/**/*.apk

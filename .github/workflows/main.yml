name: Build Noviq AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Noviq AI project
        run: |
          mkdir -p extracted
          unzip -o noviq-ai.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore extracted/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Android project
        run: |
          find extracted -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build Debug APK
        run: |
          cd extracted
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noviq-AI-debug-APK
          path: extracted/**/build/outputs/apk/**/*.apk
